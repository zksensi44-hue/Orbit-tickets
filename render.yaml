services:
  - type: web
    name: orbit-apps-transcripts
    runtime: python
    plan: free
    rootDir: orbit_transcript_server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: TRANSCRIPT_MONGODB_URI
        sync: false
      - key: TRANSCRIPT_UPLOAD_TOKEN
        generateValue: true
      - key: TRANSCRIPT_DB_NAME
        value: orbit_transcripts
      - key: TRANSCRIPT_TTL_DAYS
        value: "3"
